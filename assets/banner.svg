<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="400" viewBox="0 0 1200 400">
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <animate attributeName="x1" values="0%;100%;0%" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="100%;0%;100%" dur="5s" repeatCount="indefinite"/>
      <stop offset="0%" style="stop-color:#0095D5;stop-opacity:1">
        <animate attributeName="stop-color" values="#0095D5;#3DDC84;#FF7F50;#0095D5" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" style="stop-color:#3DDC84;stop-opacity:1">
        <animate attributeName="stop-color" values="#3DDC84;#FF7F50;#0095D5;#3DDC84" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" style="stop-color:#FF7F50;stop-opacity:1">
        <animate attributeName="stop-color" values="#FF7F50;#0095D5;#3DDC84;#FF7F50" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Fondo con gradiente animado -->
  <rect width="1200" height="400" fill="url(#gradient)" opacity="0.15"/>
  
  <!-- Círculos decorativos animados -->
  <circle cx="100" cy="100" r="50" fill="#0095D5" opacity="0.3">
    <animate attributeName="r" values="50;70;50" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0.5;0.3" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1100" cy="300" r="60" fill="#3DDC84" opacity="0.3">
    <animate attributeName="r" values="60;80;60" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0.5;0.3" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="600" cy="200" r="40" fill="#FF7F50" opacity="0.2">
    <animate attributeName="r" values="40;60;40" dur="5s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Texto principal -->
  <text x="600" y="140" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="#0095D5" text-anchor="middle" filter="url(#glow)">
    👋 Latan Villegas
    <animate attributeName="fill" values="#0095D5;#3DDC84;#FF7F50;#0095D5" dur="6s" repeatCount="indefinite"/>
  </text>
  
  <!-- Subtítulo -->
  <text x="600" y="200" font-family="Arial, sans-serif" font-size="24" fill="#3DDC84" text-anchor="middle">
    🤖 Android Developer & Full Stack
  </text>
  
  <!-- Badges decorativos -->
  <rect x="350" y="240" width="150" height="40" rx="20" fill="#0095D5" opacity="0.8"/>
  <text x="425" y="268" font-family="Arial, sans-serif" font-size="16" fill="white" text-anchor="middle" font-weight="bold">💜 Kotlin</text>
  
  <rect x="525" y="240" width="150" height="40" rx="20" fill="#3DDC84" opacity="0.8"/>
  <text x="600" y="268" font-family="Arial, sans-serif" font-size="16" fill="white" text-anchor="middle" font-weight="bold">🤖 Android</text>
  
  <rect x="700" y="240" width="150" height="40" rx="20" fill="#FF7F50" opacity="0.8"/>
  <text x="775" y="268" font-family="Arial, sans-serif" font-size="16" fill="white" text-anchor="middle" font-weight="bold">💙 TypeScript</text>
  
  <!-- Línea decorativa animada -->
  <line x1="200" y1="320" x2="1000" y2="320" stroke="#0095D5" stroke-width="3" opacity="0.6">
    <animate attributeName="x1" values="200;0;200" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="1000;1200;1000" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="stroke" values="#0095D5;#3DDC84;#FF7F50;#0095D5" dur="6s" repeatCount="indefinite"/>
  </line>
  
  <!-- Footer texto -->
  <text x="600" y="360" font-family="Arial, sans-serif" font-size="18" fill="#FF7F50" text-anchor="middle" font-style="italic">
    🚀 Apps útiles, limpias y con propósito
  </text>
</svg>
